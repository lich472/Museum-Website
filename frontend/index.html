<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>museum-app</title>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Google Translate mount point.

      It deliberately sits outside #root: the translator rewrites text nodes
      into <font> wrappers, and keeping that out of React's tree avoids the two
      fighting over the same nodes. The site supplies its own dropdown
      (src/components/LanguageSwitcher.tsx), so this element exists only to
      initialise the translator and is moved off-screen in App.css.
    -->
    <div id="google_translate_element" aria-hidden="true"></div>

    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: "en",
            // Must stay in step with LANGUAGES in
            // src/components/LanguageSwitcher.tsx — the widget ignores any
            // language that is not declared here.
            includedLanguages:
              "en,zh-CN,zh-TW,vi,ar,hi,el,it,ko,ja,es,fr,de",
            autoDisplay: false,
          },
          "google_translate_element"
        );
      }
    </script>

    <!--
      `async` matters: where Google is unreachable (mainland China, for one) a
      blocking script tag would stall the page before the app ever boots.
    -->
    <script
      async
      type="text/javascript"
      src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
    ></script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
